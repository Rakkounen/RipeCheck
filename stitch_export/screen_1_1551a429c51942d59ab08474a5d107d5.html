<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>RipeCheck - Kenali Buahmu</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'canvas': '#FAFAF5',
            'botanical-dark': '#1F2A1F',
            'botanical-text': '#4A554B',
            'botanical-muted': '#5C6B5E',
            'primary-green': '#2E7D32',
            'primary-green-active': '#256629',
            'dot-inactive': '#D6DFD4',
            'card-bg': '#FFFFFF'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            'subtle-card': '0 12px 36px -8px rgba(31, 42, 31, 0.08), 0 4px 12px -2px rgba(31, 42, 31, 0.04)',
            'btn-shadow': '0 8px 24px -4px rgba(46, 125, 50, 0.35)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom iOS & Page Styles -->
<style data-purpose="layout-styles">
    /* Remove tap highlight & enforce smooth iOS native feel */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    body {
      background-color: #FAFAF5;
      color: #1F2A1F;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Subtle pulsing effect for scanning UI corner reticles */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .scanner-bracket {
      animation: pulse-subtle 3s ease-in-out infinite;
    }
  </style>
<!-- END: Custom iOS & Page Styles -->
</head>
<body class="bg-canvas antialiased flex flex-col justify-between min-h-[100dvh] w-full max-w-md mx-auto px-6 select-none relative">
<!-- BEGIN: TopContainer (Status Bar & Navigation) -->
<header class="w-full pt-3 pb-2 flex-shrink-0">
<!-- iOS Status Bar -->
<div class="flex items-center justify-between text-botanical-dark font-semibold text-xs tracking-tight h-8 px-1" data-purpose="status-bar">
<!-- Time -->
<span class="text-sm font-medium">09:41</span>
<!-- Icons: Signal, Wifi, Battery -->
<div class="flex items-center space-x-2">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 11">
<rect height="3" rx="0.75" width="2.5" x="0" y="8"></rect>
<rect height="5.5" rx="0.75" width="2.5" x="4" y="5.5"></rect>
<rect height="8" rx="0.75" width="2.5" x="8" y="3"></rect>
<rect height="10.5" rx="0.75" width="2.5" x="12" y="0.5"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8C5.2 2.8 2.7 3.9 0.8 5.7L0 4.9C2.1 2.8 5 1.5 8 1.5C11 1.5 13.9 2.8 16 4.9L15.2 5.7C13.3 3.9 10.8 2.8 8 2.8ZM8 6.4C6.3 6.4 4.7 7.1 3.5 8.2L2.7 7.4C4.1 6.1 6 5.2 8 5.2C10 5.2 11.9 6.1 13.3 7.4L12.5 8.2C11.3 7.1 9.7 6.4 8 6.4ZM8 9.9C7.3 9.9 6.6 10.2 6.1 10.7L8 12.6L9.9 10.7C9.4 10.2 8.7 9.9 8 9.9Z"></path>
</svg>
<!-- Battery -->
<svg class="w-6 h-3 fill-current" viewbox="0 0 24 12">
<rect fill="none" height="11" rx="3.5" stroke="currentColor" stroke-width="1.2" width="20" x="0.5" y="0.5"></rect>
<rect fill="currentColor" height="7" rx="2" width="14" x="2.5" y="2.5"></rect>
<path d="M22 4.5C22.6 4.8 23 5.4 23 6C23 6.6 22.6 7.2 22 7.5V4.5Z" fill="currentColor"></path>
</svg>
</div>
</div>
<!-- Navigation Action Row -->
<div class="flex items-center justify-between mt-2 h-10" data-purpose="top-navigation">
<!-- Brand Logo Minimal -->
<div class="flex items-center space-x-2">
<div class="w-7 h-7 rounded-xl bg-emerald-100 flex items-center justify-center text-primary-green">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-base font-bold tracking-tight text-botanical-dark">RipeCheck</span>
</div>
<!-- Skip Button -->
<button aria-label="Lewati pengenalan" class="text-sm font-medium text-botanical-muted hover:text-botanical-dark transition-colors duration-150 py-1.5 px-3 rounded-full active:bg-black/5" data-purpose="skip-button" type="button">
        Lewati
      </button>
</div>
</header>
<!-- END: TopContainer -->
<!-- BEGIN: MainContent (Illustration & Copywriting) -->
<main class="flex-1 flex flex-col justify-center items-center py-2" data-purpose="onboarding-step">
<!-- Vector Illustration Card -->
<div class="w-full max-w-[328px] aspect-square rounded-3xl bg-white p-6 relative flex flex-col items-center justify-center shadow-subtle-card border border-stone-100/80 mb-7 overflow-hidden" data-purpose="fruit-scan-illustration">
<!-- Subtle Background Decorative Glow -->
<div class="absolute -top-12 -right-12 w-44 h-44 rounded-full bg-amber-100/50 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-44 h-44 rounded-full bg-emerald-100/40 blur-2xl pointer-events-none"></div>
<!-- Corner Scanning Target Reticles -->
<div class="absolute top-4 left-4 w-5 h-5 border-t-2 border-l-2 border-primary-green/70 rounded-tl-lg scanner-bracket"></div>
<div class="absolute top-4 right-4 w-5 h-5 border-t-2 border-r-2 border-primary-green/70 rounded-tr-lg scanner-bracket"></div>
<div class="absolute bottom-4 left-4 w-5 h-5 border-b-2 border-l-2 border-primary-green/70 rounded-bl-lg scanner-bracket"></div>
<div class="absolute bottom-4 right-4 w-5 h-5 border-b-2 border-r-2 border-primary-green/70 rounded-br-lg scanner-bracket"></div>
<!-- Fresh Fruits Vector SVG Composition -->
<div class="relative w-full h-full flex items-center justify-center">
<svg class="w-full h-full max-h-[220px]" fill="none" viewbox="0 0 280 240" xmlns="http://www.w3.org/2000/svg">
<!-- Soft Drop Shadows -->
<ellipse cx="140" cy="208" fill="#1F2A1F" fill-opacity="0.07" rx="95" ry="14"></ellipse>
<ellipse cx="108" cy="206" fill="#1F2A1F" fill-opacity="0.06" rx="55" ry="10"></ellipse>
<!-- FRUIT 1: Fresh Green Apple (Left & Back) -->
<g id="green-apple" transform="translate(42, 68)">
<!-- Stem -->
<path d="M52 28C52 14 59 6 64 2" stroke="#5E4028" stroke-linecap="round" stroke-width="3"></path>
<!-- Apple Leaf -->
<path d="M54 20C62 14 74 16 77 22C72 27 60 27 54 20Z" fill="#4CAF50"></path>
<path d="M54 20C63 21 72 22 77 22" stroke="#2E7D32" stroke-linecap="round" stroke-width="1.2"></path>
<!-- Apple Body -->
<path d="M48 24C28 24 14 42 14 68C14 96 34 116 52 116C62 116 67 110 74 110C81 110 86 116 96 116C114 116 134 96 134 68C134 42 120 24 100 24C88 24 80 30 74 30C68 30 60 24 48 24Z" fill="url(#appleGrad)"></path>
<!-- Apple Specular Highlight -->
<ellipse cx="44" cy="52" fill="white" fill-opacity="0.25" rx="14" ry="26" transform="rotate(-28 44 52)"></ellipse>
</g>
<!-- FRUIT 2: Ripe Mango (Center Hero) -->
<g id="ripe-mango" transform="translate(102, 42)">
<!-- Stem -->
<path d="M42 20C38 12 36 6 36 2" stroke="#422E1A" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Mango Leaf -->
<path d="M40 16C30 11 16 14 10 20C17 26 31 24 40 16Z" fill="#388E3C"></path>
<!-- Mango Body with warm golden & blush gradient -->
<path d="M42 18C62 18 88 32 96 58C106 90 95 128 75 146C55 164 26 156 14 136C-1 112 -1 76 10 48C20 28 30 18 42 18Z" fill="url(#mangoGrad)"></path>
<!-- Mango Natural Blush -->
<path d="M78 48C90 70 86 98 75 116C68 127 57 136 46 140C62 138 84 122 88 96C92 72 85 54 78 48Z" fill="#E65100" fill-opacity="0.32"></path>
<!-- Soft Gloss Highlight -->
<ellipse cx="42" cy="54" fill="white" fill-opacity="0.35" rx="10" ry="28" transform="rotate(-22 42 54)"></ellipse>
</g>
<!-- FRUIT 3: Sliced Fresh Orange (Bottom Right) -->
<g id="orange-slice" transform="translate(148, 118)">
<!-- Orange Rind -->
<circle cx="44" cy="44" fill="#FB8C00" rx="42" ry="42"></circle>
<!-- Pith Inner Layer -->
<circle cx="44" cy="44" fill="#FFF3E0" rx="38" ry="38"></circle>
<!-- Pulp Circle -->
<circle cx="44" cy="44" fill="#FFA726" rx="34" ry="34"></circle>
<!-- Segments -->
<path d="M44 44L44 14C51 14 58 17 64 22L44 44Z" fill="#FF9800"></path>
<path d="M44 44L66 24C71 30 74 37 74 44L44 44Z" fill="#FF9800"></path>
<path d="M44 44L74 44C74 52 71 59 66 64L44 44Z" fill="#FF9800"></path>
<path d="M44 44L64 66C58 71 51 74 44 74L44 44Z" fill="#FF9800"></path>
<path d="M44 44L44 74C37 74 30 71 24 66L44 44Z" fill="#FF9800"></path>
<path d="M44 44L22 64C17 58 14 51 14 44L44 44Z" fill="#FF9800"></path>
<path d="M44 44L14 44C14 36 17 29 22 24L44 44Z" fill="#FF9800"></path>
<path d="M44 44L24 22C30 17 37 14 44 14L44 44Z" fill="#FF9800"></path>
<!-- Center Core -->
<circle cx="44" cy="44" fill="#FFF8E1" r="5"></circle>
</g>
<!-- Scanning Light Overlay Beam Effect -->
<path d="M40 102H240" stroke="url(#scannerBeam)" stroke-linecap="round" stroke-width="2"></path>
<!-- Fruit Analysis Tag -->
<g id="badge-detection" transform="translate(18, 168)">
<rect fill="white" fill-opacity="0.94" filter="url(#badgeShadow)" height="30" rx="15" width="108" x="0" y="0"></rect>
<circle cx="15" cy="15" fill="#2E7D32" r="4.5"></circle>
<text fill="#1F2A1F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" x="26" y="19">Matang 94%</text>
</g>
<!-- Definitions and Gradients -->
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="appleGrad" x1="28" x2="118" y1="24" y2="116">
<stop stop-color="#9CCC65"></stop>
<stop offset="0.6" stop-color="#7CB342"></stop>
<stop offset="1" stop-color="#558B2F"></stop>
</lineargradient>
<lineargradient gradientunits="userSpaceOnUse" id="mangoGrad" x1="16" x2="88" y1="24" y2="152">
<stop stop-color="#FFD54F"></stop>
<stop offset="0.45" stop-color="#FFB300"></stop>
<stop offset="0.85" stop-color="#FB8C00"></stop>
<stop offset="1" stop-color="#F4511E"></stop>
</lineargradient>
<lineargradient gradientunits="userSpaceOnUse" id="scannerBeam" x1="40" x2="240" y1="102" y2="102">
<stop stop-color="#2E7D32" stop-opacity="0"></stop>
<stop offset="0.5" stop-color="#2E7D32" stop-opacity="0.85"></stop>
<stop offset="1" stop-color="#2E7D32" stop-opacity="0"></stop>
</lineargradient>
<filter filterunits="userSpaceOnUse" height="38" id="badgeShadow" width="116" x="-4" y="-2">
<fedropshadow dx="0" dy="3" flood-color="#1F2A1F" flood-opacity="0.12" stddeviation="3.5"></fedropshadow>
</filter>
</defs>
</svg>
</div>
</div>
<!-- Typography Group -->
<div class="text-center px-4 max-w-sm" data-purpose="text-content">
<h1 class="text-[26px] leading-tight font-bold text-botanical-dark tracking-tight mb-2.5">
        Kenali Buahmu
      </h1>
<p class="text-[15px] leading-relaxed text-botanical-text font-normal">
        Kenali jenis buah dan prediksi tingkat kematangannya hanya melalui foto.
      </p>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomControls (Dots, CTA Button, iOS Indicator) -->
<footer class="w-full pb-4 pt-2 flex flex-col items-center flex-shrink-0" data-purpose="bottom-navigation-area">
<!-- 3-Dot Page Indicator (1st active pill) -->
<div aria-label="Langkah onboarding" class="flex items-center justify-center space-x-2 mb-6" data-purpose="page-indicators" role="tablist">
<!-- Active Dot (Elongated Pill) -->
<span aria-label="Halaman 1" aria-selected="true" class="w-6 h-2 rounded-full bg-primary-green transition-all duration-300" role="tab"></span>
<!-- Inactive Dot 2 -->
<span aria-label="Halaman 2" aria-selected="false" class="w-2 h-2 rounded-full bg-dot-inactive transition-all duration-300" role="tab"></span>
<!-- Inactive Dot 3 -->
<span aria-label="Halaman 3" aria-selected="false" class="w-2 h-2 rounded-full bg-dot-inactive transition-all duration-300" role="tab"></span>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 bg-primary-green active:bg-primary-green-active text-white text-[16px] font-semibold rounded-full shadow-btn-shadow flex items-center justify-center space-x-2 transition-all duration-150 transform active:scale-[0.985] cursor-pointer" data-purpose="primary-action-button" id="btn-lanjut" type="button">
<span>Lanjut</span>
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- iOS Home Indicator Bar -->
<div class="w-full flex justify-center pt-5 pb-1" data-purpose="home-indicator-container">
<div class="w-36 h-1 bg-neutral-900/25 rounded-full" data-purpose="home-indicator"></div>
</div>
</footer>
<!-- END: BottomControls -->
<!-- BEGIN: Interactions -->
<script data-purpose="event-handlers">
    document.addEventListener('DOMContentLoaded', () => {
      const btnLanjut = document.getElementById('btn-lanjut');
      if (btnLanjut) {
        btnLanjut.addEventListener('click', () => {
          // Native tap response feedback
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(10);
          }
        });
      }
    });
  </script>
<!-- END: Interactions -->
</body></html>
