<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>RipeCheck - Izin Akses</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#2E7D32',
              primaryDark: '#256629',
              dark: '#1F2A1F',
              body: '#4A554B',
              muted: '#5C6B5E',
              border: '#E2E8DF',
              softGreen: '#EAF3E7',
              pillDot: '#D6DFD4',
              bgLight: '#F8FAF7'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-brand-bgLight text-brand-dark min-h-screen flex flex-col justify-between overflow-x-hidden">
<!-- BEGIN: TopContainer -->
<header class="w-full pt-3 px-6 shrink-0" data-purpose="status-and-top-bar">
<!-- iOS Status Bar -->
<div class="flex items-center justify-between text-brand-dark text-[14px] font-semibold tracking-tight pb-3">
<span>09:41</span>
<div class="flex items-center space-x-2">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 11">
<rect height="3" rx="0.8" width="2.5" x="0" y="8"></rect>
<rect height="5.5" rx="0.8" width="2.5" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.8" width="2.5" x="9" y="3"></rect>
<rect height="10.5" rx="0.8" width="2.5" x="13.5" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8c2.9 0 5.6 1.1 7.6 3.1.4.4.4 1 0 1.4-.4.4-1 .4-1.4 0-1.6-1.6-3.8-2.5-6.2-2.5s-4.6.9-6.2 2.5c-.4.4-1 .4-1.4 0-.4-.4-.4-1 0-1.4C2.4 3.9 5.1 2.8 8 2.8zm0 3.7c1.9 0 3.6.7 4.9 2 .4.4.4 1 0 1.4-.4.4-1 .4-1.4 0-1-1-2.2-1.4-3.5-1.4s-2.5.4-3.5 1.4c-.4.4-1 .4-1.4 0-.4-.4-.4-1 0-1.4 1.3-1.3 3-2 4.9-2zm0 3.8a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"></path>
</svg>
<!-- Battery Icon -->
<div class="relative w-6 h-3 rounded-[4px] border border-brand-dark flex items-center p-0.5">
<div class="w-full h-full bg-brand-dark rounded-sm"></div>
<div class="absolute -right-[3px] top-1/2 -translate-y-1/2 w-[2px] h-1.5 bg-brand-dark rounded-r-[1px]"></div>
</div>
</div>
</div>
</header>
<!-- END: TopContainer -->
<!-- BEGIN: MainContent -->
<main class="w-full px-6 flex-1 flex flex-col justify-start">
<!-- Vector Illustration Section -->
<div class="w-full flex items-center justify-center py-4" data-purpose="illustration">
<div class="relative w-60 h-44 flex items-center justify-center">
<!-- Soft organic background halo -->
<div class="absolute w-44 h-44 bg-[#E2EDE0] rounded-full blur-xl opacity-70"></div>
<div class="absolute w-36 h-36 bg-[#FDF0DC] rounded-full blur-lg opacity-60 translate-x-6 -translate-y-4"></div>
<svg class="relative z-10 w-full h-full" fill="none" viewbox="0 0 240 180" xmlns="http://www.w3.org/2000/svg">
<!-- Smartphone Device -->
<rect fill="#FFFFFF" height="136" rx="18" stroke="#CBD5C7" stroke-width="2.5" width="92" x="74" y="24"></rect>
<rect fill="#F4F8F3" height="120" rx="12" width="80" x="80" y="32"></rect>
<!-- Screen Notch & Speaker -->
<rect fill="#CBD5C7" height="3" rx="1.5" width="24" x="108" y="27"></rect>
<!-- Scanner grid line animation vibe -->
<path d="M88 64H152" stroke="#A8D5A2" stroke-dasharray="4 3" stroke-linecap="round" stroke-width="2"></path>
<path d="M88 116H152" stroke="#A8D5A2" stroke-dasharray="4 3" stroke-linecap="round" stroke-width="2"></path>
<!-- Fresh Mango Fruit in center -->
<g filter="drop-shadow(0px 6px 12px rgba(46, 125, 50, 0.12))">
<!-- Leaf -->
<path d="M120 72C122 62 133 58 136 58C136 67 129 74 120 72Z" fill="#3E8E41"></path>
<!-- Fruit Body -->
<path d="M120 72C138 72 148 85 146 102C143 120 125 128 112 125C97 122 92 108 94 95C96 79 108 72 120 72Z" fill="url(#fruitGradient)"></path>
<!-- Highlight shine -->
<ellipse cx="110" cy="88" fill="#FFFFFF" fill-opacity="0.35" rx="6" ry="12" transform="rotate(-25 110 88)"></ellipse>
</g>
<!-- Floating Camera Badge (Left) -->
<g filter="drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.08))">
<circle cx="56" cy="74" fill="#FFFFFF" r="22" stroke="#E2E8DF" stroke-width="1.5"></circle>
<circle cx="56" cy="74" fill="#EAF3E7" r="16"></circle>
<!-- Camera Vector Icon -->
<path d="M50 71.5C50 70.4 50.9 69.5 52 69.5H53.5L54.7 67.8C54.9 67.5 55.3 67.3 55.7 67.3H56.3C56.7 67.3 57.1 67.5 57.3 67.8L58.5 69.5H60C61.1 69.5 62 70.4 62 71.5V77.5C62 78.6 61.1 79.5 60 79.5H52C50.9 79.5 50 78.6 50 77.5V71.5Z" fill="none" stroke="#2E7D32" stroke-linejoin="round" stroke-width="1.6"></path>
<circle cx="56" cy="74.5" r="2.8" stroke="#2E7D32" stroke-width="1.4"></circle>
</g>
<!-- Floating Gallery/Photo Badge (Right) -->
<g filter="drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.08))">
<circle cx="184" cy="98" fill="#FFFFFF" r="22" stroke="#E2E8DF" stroke-width="1.5"></circle>
<circle cx="184" cy="98" fill="#EAF3E7" r="16"></circle>
<!-- Photo Vector Icon -->
<rect fill="none" height="14" rx="2.5" stroke="#2E7D32" stroke-width="1.6" width="14" x="177" y="91"></rect>
<circle cx="181" cy="95" fill="#2E7D32" r="1.3"></circle>
<path d="M178 103L181.5 99.5L184.5 102.5L187.5 98.5L190 102.5" stroke="#2E7D32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4"></path>
</g>
<!-- Gradients -->
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="fruitGradient" x1="94" x2="146" y1="72" y2="128">
<stop stop-color="#FFB300"></stop>
<stop offset="0.65" stop-color="#F47C20"></stop>
<stop offset="1" stop-color="#E53935"></stop>
</lineargradient>
</defs>
</svg>
</div>
</div>
<!-- Header Text Block -->
<div class="text-center mt-2 mb-6" data-purpose="title-and-description">
<h1 class="text-[26px] font-bold text-brand-dark tracking-tight leading-tight">
        Izin Akses
      </h1>
<p class="text-[15px] text-brand-body mt-2 leading-relaxed max-w-[320px] mx-auto">
        Izinkan akses yang diperlukan agar kamu dapat memindai buah dengan mudah.
      </p>
</div>
<!-- BEGIN: PermissionCards -->
<div class="space-y-3.5 w-full" data-purpose="permissions-container">
<!-- Card 1: Kamera -->
<article class="bg-white rounded-[16px] border border-brand-border p-4 shadow-[0_4px_16px_rgba(31,42,31,0.04)] flex items-center justify-between gap-3">
<div class="flex items-center space-x-3.5 flex-1 min-w-0">
<!-- Circular Icon Holder -->
<div class="w-11 h-11 rounded-full bg-brand-softGreen flex items-center justify-center shrink-0">
<svg class="w-5 h-5 text-brand-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
<circle cx="12" cy="13" r="4"></circle>
</svg>
</div>
<!-- Text Content -->
<div class="flex flex-col min-w-0">
<span class="text-[16px] font-semibold text-brand-dark leading-snug">Kamera</span>
<span class="text-[13px] text-brand-muted leading-tight truncate">Untuk mengambil foto buah secara langsung.</span>
</div>
</div>
<!-- Action Button -->
<button aria-label="Izinkan Akses Kamera" class="shrink-0 bg-brand-softGreen active:bg-[#dbe9d7] text-brand-primary text-[13px] font-medium px-3.5 py-2 rounded-full transition-colors" type="button">
          Izinkan Akses
        </button>
</article>
<!-- Card 2: Galeri -->
<article class="bg-white rounded-[16px] border border-brand-border p-4 shadow-[0_4px_16px_rgba(31,42,31,0.04)] flex items-center justify-between gap-3">
<div class="flex items-center space-x-3.5 flex-1 min-w-0">
<!-- Circular Icon Holder -->
<div class="w-11 h-11 rounded-full bg-brand-softGreen flex items-center justify-center shrink-0">
<svg class="w-5 h-5 text-brand-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" r="1.5"></circle>
<polyline points="21 15 16 10 5 21"></polyline>
</svg>
</div>
<!-- Text Content -->
<div class="flex flex-col min-w-0">
<span class="text-[16px] font-semibold text-brand-dark leading-snug">Galeri</span>
<span class="text-[13px] text-brand-muted leading-tight truncate">Untuk memilih foto buah yang tersimpan di HP.</span>
</div>
</div>
<!-- Action Button -->
<button aria-label="Izinkan Akses Galeri" class="shrink-0 bg-brand-softGreen active:bg-[#dbe9d7] text-brand-primary text-[13px] font-medium px-3.5 py-2 rounded-full transition-colors" type="button">
          Izinkan Akses
        </button>
</article>
</div>
<!-- END: PermissionCards -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomActionSection -->
<footer class="w-full px-6 pt-4 pb-2 shrink-0 flex flex-col items-center" data-purpose="footer-controls">
<!-- Option: Nanti Saja -->
<button class="text-[14px] font-medium text-brand-muted hover:text-brand-dark active:opacity-70 transition-colors py-1.5 focus:outline-none mb-3" type="button">
      Nanti Saja
    </button>
<!-- 3-Dot Page Indicator (Screen 3 of 3 or active 3rd dot) -->
<div aria-label="Progress onboarding" class="flex items-center justify-center space-x-2 mb-5" role="tablist">
<span aria-label="Halaman 1" class="w-2 h-2 rounded-full bg-brand-pillDot"></span>
<span aria-label="Halaman 2" class="w-2 h-2 rounded-full bg-brand-pillDot"></span>
<span aria-label="Halaman 3 aktif" class="w-6 h-2 rounded-full bg-brand-primary"></span>
</div>
<!-- Primary Action Button: Mulai -->
<button class="w-full h-[52px] bg-brand-primary hover:bg-brand-primaryDark active:scale-[0.99] transition-transform text-white font-bold text-[16px] rounded-full shadow-[0_8px_20px_rgba(46,125,50,0.28)] flex items-center justify-center focus:outline-none" type="button">
      Mulai
    </button>
<!-- iOS Home Indicator -->
<div class="w-full pt-5 pb-1 flex justify-center">
<div class="w-32 h-1 bg-[#1A1A1A] opacity-25 rounded-full"></div>
</div>
</footer>
<!-- END: BottomActionSection -->
</body></html>
